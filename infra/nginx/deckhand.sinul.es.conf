# Bloque de referencia para deckhand.sinul.es. La copia que manda es
# /etc/nginx/sites-available/my_projects (ahí viven todos los proyectos de esta máquina,
# un server{} por subdominio/puerto) — este archivo es solo documentación versionada de lo
# que se añadió allí, para no perder el rastro si /etc/nginx/sites-available/my_projects
# vuelve a editarse a mano en el futuro.
#
# deckhand necesita su propio subdominio (no un path bajo sinul.es) porque el frontend
# (react-router) y la API (constants.ts: API_URL relativo a la raíz) asumen rutas absolutas
# en la raíz de su origen — mismo motivo por el que auth-server usa auth.sinul.es en vez de
# un path bajo sinul.es (ver ../../../auth-server/infra/nginx/auth.sinul.es.conf).
#
# Paso 1 (ahora, sin cert todavía — permite validar el reto HTTP-01 de certbot más adelante):
server {
    listen 80;
    server_name deckhand.sinul.es;

    location / {
        proxy_pass http://localhost:4200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Paso 2 (después de `certbot --nginx -d deckhand.sinul.es`, una vez el registro DNS A de
# deckhand.sinul.es resuelva a la IP de este servidor): certbot reescribe este bloque en
# /etc/nginx/sites-available/my_projects añadiendo el redirect 80->443 y un server{} nuevo
# con listen 443 ssl + los certificados, igual que ya hizo con auth.sinul.es. No hace falta
# escribirlo a mano.
